<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-copy="name">小方塊跑酷</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ex.css">
</head>
<body class="ex-page">
  <!-- 原本的開場畫面（會被感染） -->
  <div id="ex-origin">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">📦</span><span id="ex-brand" data-copy="name">小方塊跑酷</span></div>
    </header>
    <main>
      <section class="screen active" id="screen-intro">
        <div class="panel intro-panel">
          <div class="intro-top"><span class="eyebrow" id="ex-eyebrow" data-copy="name">小方塊跑酷</span><span class="offline-badge" id="ex-badge" data-copy="local">● 分數留在本機</span></div>
          <div class="packet-helper" aria-hidden="true">
            <svg class="packet-face" viewBox="0 0 44 18" fill="currentColor" focusable="false">
              <g class="friendly-eyes"><circle cx="6" cy="7" r="3"/><circle cx="38" cy="7" r="3"/></g>
              <path class="infected-eyes" d="M1 2v9h10z M43 2v9H33z"/>
              <path d="M17 9a5 5 0 0 0 10 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="terminal-line" id="ex-terminal" data-copy="alarm">[ 23:47 ] 廣播風暴警報 · 機房等待救援</p>
          <h1 id="ex-title" data-text="機房被鎖住了！" data-copy="locked">機房被鎖住了！</h1>
          <p class="intro-subtitle" id="ex-subtitle" data-copy="mission">帶上小封包，完成今晚的逃脫任務。</p>
          <div id="ex-story">
            <p data-copy="opening">機房出現廣播風暴，帶上小方塊，準備進入跑酷挑戰。</p>
          </div>
          <label class="name-field"><span data-copy="nicknameLabel">挑戰者暱稱</span>
            <input id="ex-name" maxlength="10" data-copy-placeholder="nicknameInput" placeholder="輸入你的暱稱" autocomplete="off" disabled>
          </label>
          <button class="btn primary big" id="ex-start" disabled data-copy="escape">開始逃脫 ▶</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 紅色感染布幕 -->
  <div id="ex-curtain" aria-hidden="true"></div>

  <!-- 跑酷遊戲 -->
  <section id="ex-game" class="ex-layer" hidden>
    <div id="game-stage">
      <canvas id="ex-canvas" width="960" height="540" data-copy-label="canvas" aria-label="小方塊跑酷遊戲畫面"></canvas>
      <div class="touch-controls" data-copy-label="controls" aria-label="遊戲控制">
        <div class="move-controls">
          <button type="button" class="control-btn" data-control="left" data-copy-label="left" aria-label="向左移動">←</button>
          <button type="button" class="control-btn" data-control="right" data-copy-label="right" aria-label="向右移動">→</button>
        </div>
        <button type="button" class="control-btn jump-btn" data-control="jump" data-copy-label="jump" aria-label="跳躍" data-copy="jump">跳躍</button>
        <button type="button" class="control-btn pause-btn" id="pause-btn" data-copy="pause">暫停</button>
      </div>
    </div>
  </section>

  <!-- 離開視窗或主動暫停後，確認繼續再恢復 -->
  <div id="ex-pause" class="ex-modal" hidden>
    <div class="ex-card">
      <h2 data-copy="paused">遊戲已暫停</h2>
      <button type="button" class="ex-btn" id="resume-btn" data-copy="resume">繼續遊戲</button>
    </div>
  </div>

  <!-- 結算 -->
  <div id="ex-quiz" class="ex-modal" role="dialog" aria-modal="true" aria-labelledby="quiz-title" hidden>
    <div class="ex-card quiz-card">
      <h2 id="quiz-title" data-copy="quiz">防詐小練習</h2>
      <p id="quiz-question" class="quiz-copy"></p>
      <div id="quiz-options" class="quiz-options"></div>
      <p id="quiz-feedback" class="quiz-copy" role="status"></p>
      <p class="ex-small" data-copy="quizNote">作答只存在這個裝置，不上傳、不列入正式研究；答對補滿能量，答錯會扣少量生命，不影響分數。</p>
      <div class="r-btns">
        <button type="button" class="ex-btn ghost" id="quiz-retry" hidden data-copy="retryQuiz">重新載入題目</button>
        <button type="button" class="ex-btn" id="quiz-continue" hidden data-copy="resume">繼續遊戲</button>
        <button type="button" class="ex-btn ghost" id="quiz-skip" hidden data-copy="skip">略過並繼續</button>
      </div>
    </div>
  </div>

  <!-- 結算 -->
  <section id="ex-result" class="ex-layer" hidden>
    <div class="ex-card result-card">
      <h1 id="r-title" class="r-title" data-copy="GAME OVER">GAME OVER</h1>
      <p id="r-reason" class="ex-small"></p>
      <div class="r-stats">
        <div><span data-copy="nameStat">暱稱</span><b id="r-name">-</b></div>
        <div><span data-copy="score">分數</span><b id="r-score">0</b></div>
        <div><span data-copy="level">等級</span><b id="r-level">1</b></div>
        <div><span>🍎</span><b id="r-fruit">0</b></div>
      </div>
      <p id="r-rank" class="r-rank"></p>
      <div id="r-board" class="board-wrap"></div>
      <div class="r-btns">
        <button class="ex-btn ghost" id="r-new" data-copy="switchPlayer">換新使用者</button>
        <button class="ex-btn" id="r-retry" data-copy="again">再試一次</button>
      </div>
    </div>
  </section>

  <button class="rank-btn" id="rank-btn" data-copy-title="rankTitle" title="本機排行榜" data-copy-label="rankTitle" aria-label="本機排行榜">🏆</button>
  <button type="button" class="control-btn sound-toggle" id="sound-btn" data-copy-title="mute" title="關閉音效" data-copy-label="mute" aria-label="關閉音效" aria-pressed="true">🔊</button>

  <!-- EX 排行榜 -->
  <div id="ex-board-modal" class="ex-modal" hidden>
    <div class="ex-card">
      <div class="ex-tag" data-copy="rankTop">本機排行榜・前 10 名</div>
      <div id="m-board" class="board-wrap"></div>
      <div class="r-btns">
        <button class="ex-btn ghost" id="board-clear" data-copy="clearRanks">清除排行榜</button>
        <button class="ex-btn" id="board-close" data-copy="close">關閉</button>
      </div>
    </div>
  </div>
  <div class="ex-toast" id="ex-toast"></div>

  <script src="js/language.js"></script>
  <script src="js/ex.js"></script>
</body>
</html>
